behaviors:
  SoccerTwos:
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.0005  # 少し学習率を上げる
      batch_size: 256  # バッチサイズを減らして計算コストを削減
      buffer_size: 100000  # バッファサイズを小さくして更新頻度を高める
      tau: 0.005
      init_entcoef: 0.2

      # use_rs_norm: true
      # use_residual_blocks: true
      # post_layer_norm: true

    network_settings:
      custom_model: simba_actor  # SimBaを利用
      normalize: true  # 正規化を無効化してみる
      hidden_units: 128  # ネットワークの複雑さを軽減
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 64
    summary_freq: 10000
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 5  # 過去のモデルとの対戦期間を短く
      play_against_latest_model_ratio: 0.3  # 最新モデルとの対戦割合を下げる
      initial_elo: 1200.0
